function ajouterValeur(resultat,destination,source,valeur){
 const courant=resultat[destination]||'';
 const lignes=courant.split('\n').map(x=>x.trim()).filter(Boolean);
 const contenu=valeur.replace(/^(?:saison|disponibilité|catégorie|category)\s*:\s*/i,'').trim();

 resultat[destination]=courant+'\n'+source+' : '+contenu;
}

function redistribuerSousChamps(resultat){
 const champs=[...Object.keys(resultat)];
 for(const origine of champs){
  if(origine==='Nom'||origine==='Catégorie Catalogue'||origine==='Disponibilité/Saison')continue;
  const texte=resultat[origine];if(typeof texte!=='string'||!texte.includes(':'))continue;
  const gardees=[];
  for(const ligne of texte.split('\n')){
   const match=ligne.match(/^\s*([^:]{2,65})\s*:\s*(.+)\s*$/);
   if(!match){gardees.push(ligne);continue}
   const etiquette=match[1].replace(/^[-•]\s*/,'');
   const destination=destinationsSousChamps[normaliserCle(etiquette)];
   if(!destination||destination===origine){gardees.push(ligne);continue}
   const valeur=match[2].trim();
   // Ne pas remplacer un champ simple déjà rempli ni déplacer des mentions ambigües.
   if(destination==='Disponibilité/Saison'){
    const ancien=resultat[destination]||'';
    if(!ancien)resultat[destination]=valeur;
    else if(!ancien.split(' · ').some(x=>normaliserCle(x)===normaliserCle(valeur)))resultat[destination]=ancien+' · '+valeur;
   }else ajouterValeur(resultat,destination,etiquette,valeur);
  }
  resultat[origine]=gardees.join('\n').trim();
 }

}
function convertirAncienneFiche(encyclopedie,fiche){
 const resultat={};const paires=correspondancesProduit[encyclopedie];if(!paires)throw Error('Encyclopédie non reconnue');
 const index=new Map(Object.entries(fiche).map(([k,v])=>[normaliserCle(k),[k,v]]));
 const traites=new Set();
 for(const [source,destination] of paires){
  const match=index.get(normaliserCle(source));if(!match)continue;
  const [cle,brut]=match;traites.add(normaliserCle(cle));
  const valeur=valeurLisible(brut);if(!valeur)continue;
  if(destination==='Catégorie Catalogue'){
   // Un champ simple ne doit jamais recevoir plusieurs catégories collées.
   const categories=valeur.split(/\n+/).map(x=>x.trim()).filter(Boolean);
   resultat[destination]=categories[0]||'';
   if(categories.length>1)ajouterValeur(resultat,'Remarques','Autres catégories anciennes',categories.slice(1).join(', '));
  }else if(destination==='Disponibilité/Saison'){
   const partie=valeur.replace(/^(?:saison|disponibilité)\s*:\s*/i,'').trim();
   const actuel=resultat[destination]||'';
   if(!actuel)resultat[destination]=partie;
   else if(!actuel.split(' · ').some(x=>normaliserCle(x)===normaliserCle(partie)))resultat[destination]=actuel+' · '+partie;
  }else ajouterValeur(resultat,destination,source,valeur);
 }
 // Conserver les véritables informations non associées, jamais les identifiants internes.
 for(const [cle,brut] of Object.entries(fiche)){
  const n=normaliserCle(cle);if(traites.has(n)||clesTechniquesNormalisees.has(n)||cle.startsWith('_'))continue;
  const valeur=valeurLisible(brut);if(valeur)ajouterValeur(resultat,'Remarques',cle,valeur);
 }

}

const sourceKey=kind=>kind==='herbs'?'hg-herbs-spices-v28':kind==='produce'?'hg-fruits-vegetables-v282':'hg-encyclopedias-v1';
function lireStockageSource(key){return new Promise((resolve,reject)=>{
 const request=indexedDB.open('HerbierGourmandData',1);
 request.onerror=()=>reject(request.error||Error('Stockage indisponible'));
 request.onsuccess=()=>{const db=request.result;
  if(!db.objectStoreNames.contains('kv')){db.close();resolve(null);return}
  const tx=db.transaction('kv','readonly'),req=tx.objectStore('kv').get(key);
  req.onsuccess=()=>{const value=req.result;db.close();resolve(value==null?null:String(value))};
  req.onerror=()=>{db.close();reject(req.error||Error('Lecture impossible'))};
 };
})}
async function fichesOriginales(kind){

function fichePourConversion(fiche){const result={};for(const [key,value] of Object.entries(fiche)){
 if(clesTechniquesNormalisees.has(normaliserCle(key))||key.startsWith('_'))continue;
 const label=nomsSources[key]||key;

  if(normaliserCle(result[label])!==normaliserCle(texte)){
   const priorite=/^(catalogCategory|catalogueCategory)$/i.test(key);
   const autre=priorite?result[label]:texte;
   result[label]=priorite?texte:result[label];
   result['Remarques']=((result['Remarques']||'')+'\nCatégorie ancienne : '+autre).trim();
  }
  continue;
 }
 if(!result[label])result[label]=texte;
 else if(!result[label].split('\n').some(x=>normaliserCle(x)===normaliserCle(texte)))result[label]+='\n'+texte;
 }return result}

function choisirFiche(rows,enc){return new Promise(resolve=>{
 const old=document.getElementById('choixAncienneFiche');if(old)old.remove();
 const dialog=document.createElement('dialog');dialog.id='choixAncienneFiche';dialog.style.cssText='width:min(680px,94vw);max-height:85vh;border:1px solid #cad4ca;border-radius:14px;padding:20px;color:#263a30';
 const title=document.createElement('h2');title.textContent='Choisir une fiche · '+enc;dialog.append(title);
 const info=document.createElement('p');info.textContent=rows.length+' fiches disponibles · lecture seule';dialog.append(info);
 const search=document.createElement('input');search.placeholder='Rechercher une fiche…';search.style.cssText='width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccd3cc;border-radius:7px';dialog.append(search);
 const list=document.createElement('div');list.style.cssText='max-height:48vh;overflow:auto;display:grid;gap:6px';dialog.append(list);
 const close=document.createElement('button');close.textContent='Annuler';close.style.cssText='margin-top:12px;padding:10px 16px';dialog.append(close);
 let finished=false;const finish=value=>{if(finished)return;finished=true;dialog.close();dialog.remove();resolve(value)};
 close.onclick=()=>finish(null);dialog.oncancel=e=>{e.preventDefault();finish(null)};
 const sorted=[...rows].sort((a,b)=>String(a.name||a.Nom||'').localeCompare(String(b.name||b.Nom||''),'fr'));
 const renderList=()=>{list.replaceChildren();const q=search.value.toLocaleLowerCase('fr');let count=0;
  for(const item of sorted){const name=String(item.name||item.Nom||item.title||item.id||'Sans nom');if(!name.toLocaleLowerCase('fr').includes(q))continue;
   count++;const button=document.createElement('button');button.type='button';button.textContent=name;button.style.cssText='text-align:left;padding:10px;background:#f6f8f5;border:1px solid #d9ded8;border-radius:7px;color:#263a30';button.onclick=()=>finish(item);list.append(button);
   if(count>=150)break;
  }if(!count){const p=document.createElement('p');p.textContent='Aucune fiche correspondante.';list.append(p)}
 };search.oninput=renderList;renderList();document.body.append(dialog);dialog.showModal();search.focus();
})}
$('importOld').onclick=async()=>{
 if(mode!=='Produit'){alert('Essai réservé aux Produits.');return}
 const options=sourcesAnciennes.map(([name],i)=>(i+1)+' · '+name).join('\n');
 const answer=prompt('Encyclopédie d’origine :\n'+options+'\nSaisir son numéro :');if(answer===null)return;
 const chosen=sourcesAnciennes[Number(answer)-1];if(!chosen){alert('Encyclopédie non reconnue');return}
 const [enc,kind]=chosen;
 try{const rows=await fichesOriginales(kind);if(!rows.length){alert('Aucune fiche disponible dans « '+enc+' ». Ouvre d’abord Herbier Gourmand pour initialiser cette encyclopédie.');return}
  const fiche=await choisirFiche(rows,enc);if(!fiche)return;
  const data=convertirAncienneFiche(enc,fichePourConversion(fiche));
  if(!data.Nom)data.Nom=String(fiche.name||fiche.Nom||fiche.title||'');
  if(!data.Nom){alert('Cette fiche ne contient pas de nom.');return}
  const id='essai-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  entries.push({id,type:'Produit',data});save();render();edit(id);
 }catch(err){console.error(err);alert('Lecture impossible : '+err.message)}
};
$('add').onclick=()=>edit(null);$('close').onclick=$('cancel').onclick=()=>$('editor').close();$('viewClose').onclick=()=>$('viewer').close();$('search').oninput=render;$('clear').onclick=()=>{$('search').value='';render()};$('print').onclick=()=>window.print();$('random').onclick=()=>{let a=entries.filter(x=>x.type===mode);if(a.length)view(a[Math.floor(Math.random()*a.length)].id);else alert('Pas de résultat')};$('viewEdit').onclick=()=>{$('viewer').close();edit(viewing)};$('viewDelete').onclick=()=>{if(confirm('Supprimer cette fiche d’essai ?')){entries=entries.filter(x=>x.id!==viewing);save();$('viewer').close();render()}};$('viewPrint').onclick=()=>window.print();$('reset').onclick=()=>{if(confirm('Effacer toutes les fiches du Modèle uniquement ?')){entries=[];save();render()}};
$('merge').onclick=()=>{let a=entries.filter(x=>x.type===mode);if(a.length<2){alert('Il faut au moins deux fiches d’essai du même type.');return}let options=a.map((x,i)=>`${i+1}. ${x.data[x.type==='Produit'?'Nom':'Titre']}`).join('\n');let from=Number(prompt('Fusionner : numéro de la fiche à absorber\n'+options));let to=Number(prompt('Numéro de la fiche à conserver\n'+options));if(!from||!to||from===to||!a[from-1]||!a[to-1])return;if(!confirm('Fusionner ces deux fiches d’essai ?'))return;let s=a[from-1],d=a[to-1];for(let [k,v] of Object.entries(s.data)){if(!v)continue;if(!d.data[k])d.data[k]=v;else if(d.data[k]!==v&&k!=='Nom'&&k!=='Titre')d.data[k]+='\n'+v}entries=entries.filter(x=>x.id!==s.id);save();render()};render();
})();
