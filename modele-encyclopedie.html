<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herbier Gourmand · Encyclopédie Modèle</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#263a30;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{padding:12px 18px;background:#e6f1e9;border-bottom:1px solid #bfd3c4;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.3rem;margin:0}h2{font-size:1.08rem;margin:8px 0}main{max-width:1120px;margin:auto;padding:14px}button,.btn{cursor:pointer;background:white;border:1px solid #a9bbae;border-radius:7px;padding:8px 11px;font:inherit;color:inherit;text-decoration:none}button.primary,.active{background:#28774e!important;color:white!important;border-color:#28774e!important}button.danger{color:#a32626}button:disabled{opacity:.45} .toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.hint{color:#607268;font-size:.85rem}.panel{background:white;border:1px solid #d9e4da;border-radius:10px;padding:13px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem}.field input,.field textarea,.field select{width:100%;font:inherit;padding:8px;border:1px solid #b9c8bd;border-radius:6px;background:white}.field textarea{min-height:36px;height:42px;resize:vertical}.field input{min-height:36px}.grid{gap:7px 12px}.field{gap:2px;font-size:.83rem}.field input,.field textarea,.field select{padding:5px 7px}.product-grid .field{min-width:0}.prep-grid .recipe-wide{grid-column:1/-1}.prep-grid .field:not(.recipe-wide){display:grid;grid-template-columns:minmax(95px,.7fr) minmax(0,1.3fr);align-items:center}.prep-grid .field textarea{grid-column:1/-1}.prep-grid .field.recipe-wide textarea{min-height:75px}.product-grid .field textarea{height:44px} .wide{grid-column:1/-1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.card{border:1px solid #d8e2d8;background:white;border-radius:8px;padding:12px}.card strong{display:block;margin-bottom:7px}.card .toolbar{margin-bottom:0}dialog{width:min(1100px,98vw);max-height:96vh;border:1px solid #aac6b2;border-radius:12px;padding:16px}dialog::backdrop{background:#16251b88}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.status{padding:8px 10px;border-left:3px solid #3e9562;background:#eff7f0}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#e8efe9;font-size:.8rem} @media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{align-items:flex-start}h1{font-size:1.05rem}}@media print{header,.toolbar,.hint,dialog,.noprint{display:none!important}.panel{border:0}body{background:white}}
</style></head><body><header><div><h1>🧪 Encyclopédie « Modèle »</h1><div class="hint">Laboratoire isolé · aucune écriture dans les huit encyclopédies ni le Catalogue</div></div><a class="btn" href="index.html#library" id="backLibrary">← Bibliothèque</a></header><main>
<div class="toolbar"><button id="add" class="primary">+ Ajouter</button><button id="merge">Fusionner</button><button id="print">Imprimer la liste</button><button id="random">Découverte surprise</button><button id="products" class="active">Produits</button><button id="preps">Préparations</button></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Rechercher une fiche…" aria-label="Rechercher" style="flex:1;min-width:180px;padding:8px"><button id="clear">Effacer</button><button id="reset" class="danger">Vider les essais</button></div><div id="status" class="hint"></div></div><div id="cards" class="cards"></div>
<dialog id="editor"><div class="head"><h2 id="editTitle">Fiche</h2><button id="close" type="button">✕</button></div><p class="hint">Essais isolés : aucune modification du Catalogue ni des huit encyclopédies.</p><form id="form"><div id="fields" class="grid"></div><div class="toolbar" style="justify-content:flex-end"><button type="button" id="cancel">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form></dialog>
<dialog id="viewer"><div class="head"><h2 id="viewTitle"></h2><button id="viewClose">✕</button></div><div id="viewContent" class="grid"></div><div class="toolbar"><button id="viewEdit">Modifier</button><button id="viewDelete" class="danger">Supprimer</button><button id="viewPrint">Imprimer</button></div></dialog>
</main><script>
(()=>{'use strict';const KEY='hg-modele-essais-v1';let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch(e){entries=[]}let mode='Produit',editing=null,viewing=null;
$('backLibrary').addEventListener('click',e=>{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back()}});const $=id=>document.getElementById(id), save=()=>localStorage.setItem(KEY,JSON.stringify(entries));
const product=[['Nom','text'],['Catégorie Catalogue','text'],['Disponibilité/Saison','text'],['Description','textarea'],['Partie utilisée / Intensité et Formes','textarea'],['Localisation / Origine / Catégorie botanique','textarea'],['Utilisations culinaires / Quantités','textarea'],['Modes de préparation','textarea'],['À associer avec','textarea'],['Conservation','textarea'],['Bienfaits / Caractéristiques','textarea'],['Associations renforçant les bienfaits','textarea'],['Substitution','textarea'],['Remarques','textarea']];
const prep=[['Titre','text'],['Tags','text'],['Catégorie','text'],['Encyclopédie','text'],['Type','text'],['Effort','text'],['Difficulté','text'],['Spécial','text'],['Portions','text'],['Température','text'],['Saison','text'],['Période','text'],['Ingrédients','textarea'],['Vérifier les ingrédients','action'],['Préparation','textarea']];
const schema=()=>mode==='Produit'?product:prep;
function render(){let q=$('search').value.toLocaleLowerCase('fr');let arr=entries.filter(x=>x.type===mode&&(x.data[x.type==='Produit'?'Nom':'Titre']||'').toLocaleLowerCase('fr').includes(q)).sort((a,b)=>(a.data[a.type==='Produit'?'Nom':'Titre']||'').localeCompare((b.data[b.type==='Produit'?'Nom':'Titre']||''),'fr',{sensitivity:'base'}));$('cards').replaceChildren();$('status').textContent=arr.length+' fiche(s) '+mode.toLowerCase()+' · '+entries.length+' fiche(s) d’essai au total';if(!arr.length){$('cards').textContent='Aucune fiche d’essai. Utilise « Ajouter » pour commencer.';return}arr.forEach(x=>{let c=document.createElement('div');c.className='card';let t=document.createElement('strong');t.textContent=x.data[x.type==='Produit'?'Nom':'Titre']||'(sans nom)';c.append(t);let p=document.createElement('span');p.className='pill';p.textContent=x.type;c.append(p);let actions=document.createElement('div');actions.className='toolbar';let b=document.createElement('button');b.textContent='Voir';b.onclick=()=>view(x.id);let e=document.createElement('button');e.textContent='Modifier';e.onclick=()=>edit(x.id);actions.append(b,e);c.append(actions);$('cards').append(c)})}
function edit(id){editing=id;let item=entries.find(x=>x.id===id);$('editTitle').textContent=(item?'Modifier':'Ajouter')+' · '+mode;$('fields').replaceChildren();$('fields').className='grid '+(mode==='Produit'?'product-grid':'prep-grid');schema().forEach(([name,type])=>{let l=document.createElement('label');l.className='field'+(mode==='Préparation'&&(['Titre','Tags','Ingrédients','Vérifier les ingrédients','Préparation'].includes(name))?' recipe-wide':'');let s=document.createElement('span');s.textContent=name;l.append(s);if(type==='action'){let b=document.createElement('button');b.type='button';b.textContent='Vérifier les ingrédients (essai)';b.onclick=()=>alert('Fonction à raccorder au Catalogue lors de l’intégration définitive. Aucune donnée du Catalogue n’est modifiée.');l.append(b)}else{let el=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')el.type='text';el.name=name;el.value=item?.data[name]||'';if(name==='Nom'||name==='Titre')el.required=true;l.append(el)}$('fields').append(l)});$('editor').showModal()}
function view(id){viewing=id;let x=entries.find(e=>e.id===id);if(!x)return;$('viewTitle').textContent=x.data[x.type==='Produit'?'Nom':'Titre'];$('viewContent').replaceChildren();(x.type==='Produit'?product:prep).filter(([n,t])=>t!=='action'&&x.data[n]).forEach(([n])=>{let d=document.createElement('div');d.className='panel';let b=document.createElement('strong');b.textContent=n;let p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.textContent=x.data[n];d.append(b,p);$('viewContent').append(d)});$('viewer').showModal()}
$('form').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData($('form')).entries());if(editing){let x=entries.find(x=>x.id===editing);x.data=data}else entries.push({id:'essai-'+Date.now()+'-'+Math.random().toString(36).slice(2),type:mode,data});save();$('editor').close();render()};
$('products').onclick=()=>switchMode('Produit');$('preps').onclick=()=>switchMode('Préparation');function switchMode(m){mode=m;$('products').classList.toggle('active',m==='Produit');$('preps').classList.toggle('active',m==='Préparation');render()}
$('add').onclick=()=>edit(null);$('close').onclick=$('cancel').onclick=()=>$('editor').close();$('viewClose').onclick=()=>$('viewer').close();$('search').oninput=render;$('clear').onclick=()=>{$('search').value='';render()};$('print').onclick=()=>window.print();$('random').onclick=()=>{let a=entries.filter(x=>x.type===mode);if(a.length)view(a[Math.floor(Math.random()*a.length)].id);else alert('Pas de résultat')};$('viewEdit').onclick=()=>{$('viewer').close();edit(viewing)};$('viewDelete').onclick=()=>{if(confirm('Supprimer cette fiche d’essai ?')){entries=entries.filter(x=>x.id!==viewing);save();$('viewer').close();render()}};$('viewPrint').onclick=()=>window.print();$('reset').onclick=()=>{if(confirm('Effacer toutes les fiches du Modèle uniquement ?')){entries=[];save();render()}};
$('merge').onclick=()=>{let a=entries.filter(x=>x.type===mode);if(a.length<2){alert('Il faut au moins deux fiches d’essai du même type.');return}let options=a.map((x,i)=>`${i+1}. ${x.data[x.type==='Produit'?'Nom':'Titre']}`).join('\n');let from=Number(prompt('Fusionner : numéro de la fiche à absorber\n'+options));let to=Number(prompt('Numéro de la fiche à conserver\n'+options));if(!from||!to||from===to||!a[from-1]||!a[to-1])return;if(!confirm('Fusionner ces deux fiches d’essai ?'))return;let s=a[from-1],d=a[to-1];for(let [k,v] of Object.entries(s.data)){if(!v)continue;if(!d.data[k])d.data[k]=v;else if(d.data[k]!==v&&k!=='Nom'&&k!=='Titre')d.data[k]+='\n'+v}entries=entries.filter(x=>x.id!==s.id);save();render()};render();
})();
</script></body></html>
